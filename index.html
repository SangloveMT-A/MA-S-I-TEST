<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Sói Online - Có Cupid & Tích hợp Firebase</title>
    
    <!-- Thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 14px; }
        .lobby-card { background: rgba(15, 23, 42, 0.92); border: 2px solid #475569; border-radius: 16px; padding: 25px; max-width: 500px; margin: 30px auto; text-align: center; }
        .lobby-card h1 { margin-top: 0; color: #facc15; font-size: 28px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 16px; outline: none; }
        .btn { background: #ef4444; color: white; border: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: #3b82f6; }
        .btn-success { background: #10b981; }
        .btn-warn { background: #f59e0b; color: #000; width: auto; }
        .top-bar { display: flex; justify-content: space-between; background: #0f172a; padding: 10px 16px; border-radius: 12px; border: 1px solid #334155; flex-wrap: wrap; gap: 10px; }
        .phase-badge { font-weight: bold; padding: 6px 14px; border-radius: 20px; background: #312e81; color: #c7d2fe; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
        .player-card { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; position: relative; }
        .player-card.selected { border-color: #facc15; background: rgba(250, 204, 21, 0.15); }
        .player-card.dead { opacity: 0.45; border-color: #7f1d1d; cursor: not-allowed; }
        .avatar { font-size: 32px; margin-bottom: 4px; }
        .p-name { font-weight: bold; font-size: 15px; }
        .p-status { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .action-panel { background: #0f172a; border: 2px solid #475569; border-radius: 12px; padding: 14px; text-align: center; }
        #action-prompt { font-size: 16px; font-weight: bold; color: #fde047; margin-bottom: 10px; }
        .chat-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; height: 230px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 7px; font-size: 14px; }
        .log-item { padding: 7px 11px; border-radius: 8px; background: #1e293b; }
        .log-death { background: #450a0a; color: #fca5a5; border-left: 4px solid #ef4444; }
        .log-seer { background: #064e3b; color: #a7f3d0; border-left: 4px solid #10b981; }
        .log-cupid { background: #831843; color: #fbcfe8; border-left: 4px solid #ec4899; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { width: 100%; }
        .chat-input-row .btn { width: auto; margin: 0; }
    </style>
</head>
<body>
    <!-- MÀN HÌNH CHỜ (LOBBY) -->
    <div id="lobby-screen" class="lobby-card">
        <h1>🐺 MA SÓI ONLINE</h1>
        <div class="form-group">
            <label>Tên của bạn:</label>
            <input type="text" id="player-name-input" placeholder="Nhập tên...">
        </div>
        <div class="form-group">
            <label>Số người chơi tối đa:</label>
            <select id="max-players-select">
                <option value="6">6 Người (2 Sói, 1 Tiên, 1 Bảo, 2 Dân)</option>
                <option value="8" selected>8 Người (2 Sói, 1 Tiên, 1 Bảo, 1 Thợ Săn, 1 Cupid, 2 Dân)</option>
                <option value="10">10 Người (3 Sói, 1 Tiên, 1 Bảo, 1 Thợ Săn, 1 Cupid, 3 Dân)</option>
            </select>
        </div>
        <button class="btn btn-success" onclick="createRoom()">👑 Tạo Phòng Mới</button>
        <div style="margin:15px 0; color:#94a3b8; font-size:13px;">HOẶC VÀO PHÒNG CÓ SẴN</div>
        <input type="number" id="room-code-input" class="form-group" placeholder="Nhập mã phòng 4 số...">
        <button class="btn btn-primary" onclick="joinRoom()">🚪 Tham Gia Phòng</button>
        <div id="lobby-status" style="margin-top:12px; color:#facc15; font-size:14px;"></div>
    </div>

    <!-- MÀN HÌNH GAME -->
    <div id="game-screen" class="container" style="display:none;">
        <div class="top-bar">
            <div style="background:#facc15; color:#000; padding:5px 12px; border-radius:8px; font-weight:bold;">🔑 Mã: <span id="display-room-code"></span></div>
            <div class="phase-badge" id="phase-display">⏳ SẢNH CHỜ</div>
            <div id="my-role-display" style="font-weight:bold; color:#38bdf8;">Vai trò: Chưa bắt đầu</div>
        </div>
        
        <div class="players-grid" id="players-grid"></div>
        
        <div class="action-panel">
            <div id="action-prompt">Đang chờ chủ phòng bắt đầu...</div>
            <div id="action-buttons"></div>
        </div>
        
        <div class="chat-box" id="chat-box"></div>
        
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendChat()">
            <button class="btn btn-primary" onclick="sendChat()">Gửi</button>
        </div>
    </div>

    <!-- MÃ NGUỒN LOGIC GAME (JAVASCRIPT) -->
    <script>
        // ==========================================
        // 1. CẤU HÌNH FIREBASE CỦA BẠN (DÁN VÀO ĐÂY)
        // ==========================================
        const firebaseConfig = {
            apiKey: "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY",
            authDomain: "ghep-ma-soi.firebaseapp.com",
            databaseURL: "https://ghep-ma-soi-default-rtdb.firebaseio.com",
            projectId: "ghep-ma-soi",
            storageBucket: "ghep-ma-soi.firebasestorage.app",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };
        
        // Khởi động Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ==========================================
        // 2. BIẾN TOÀN CỤC & TRẠNG THÁI GAME
        // ==========================================
        const AVATARS = ["😎", "👩", "👨", "👧", "🦊", "🐼"];
        let isHost = false, roomCode = "", myId = "", myName = "";
        let state = { maxPlayers: 8, phase: 'LOBBY', dayCount: 1, players: [], lovers: [], hunterId: null };
        let selectedTargets = [];

        // ==========================================
        // 3. HỆ THỐNG KẾT NỐI (LOBBY)
        // ==========================================
        function createRoom() {
            myName = document.getElementById('player-name-input').value.trim();
            if (!myName) return alert("Vui lòng nhập tên của bạn!");
            
            isHost = true; 
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            state.maxPlayers = parseInt(document.getElementById('max-players-select').value);
            myId = "HOST_" + Math.random().toString(36).substr(2, 9);
            
            document.getElementById('lobby-status').innerText = "Đang tạo phòng trên Database...";

            state.players = [{ id: myId, name: myName, avatar: AVATARS[0], isAI: false, role: null, alive: true, votes: 0 }];
            
            const roomRef = db.ref('rooms/' + roomCode);
            roomRef.set({ state: state }).then(() => {
                enterGame();
                broadcastLog(`👑 Đã tạo phòng <b>${roomCode}</b>. Hãy gửi mã này cho bạn bè!`, 'system');
                
                // Lắng nghe người chơi mới xin vào phòng
                db.ref('rooms/' + roomCode + '/joinRequests').on('child_added', (snap) => {
                    const newPlayer = snap.val();
                    state.players.push({ id: newPlayer.id, name: newPlayer.name, avatar: AVATARS[state.players.length % AVATARS.length], isAI: false, alive: true, votes: 0 });
                    broadcast();
                    broadcastLog(`👋 <b>${newPlayer.name}</b> đã tham gia!`, 'system');
                    snap.ref.remove(); // Xóa yêu cầu sau khi duyệt
                });

                // Lắng nghe hành động ban đêm từ các máy khác
                db.ref('rooms/' + roomCode + '/actions').on('child_added', (snap) => {
                    const action = snap.val();
                    processAction(action.playerId, action.targets);
                    snap.ref.remove();
                });

                roomRef.onDisconnect().remove(); // Tự xóa phòng khi Chủ thoát
                listenToChat();
            });
        }

        function joinRoom() {
            myName = document.getElementById('player-name-input').value.trim();
            const code = document.getElementById('room-code-input').value.trim();
            if (!myName || code.length !== 4) return alert("Vui lòng kiểm tra lại tên và mã phòng!");
            
            isHost = false; 
            roomCode = code;
            myId = "PLAYER_" + Math.random().toString(36).substr(2, 9);
            
            document.getElementById('lobby-status').innerText = "Đang kết nối vào phòng...";

            db.ref('rooms/' + roomCode + '/state').once('value').then((snap) => {
                if (!snap.exists()) {
                    document.getElementById('lobby-status').innerText = "❌ Không tìm thấy phòng!";
                    return alert("Mã phòng không tồn tại hoặc chủ phòng đã giải tán!");
                }
                
                // Gửi yêu cầu xin vào phòng cho Host xử lý
                db.ref('rooms/' + roomCode + '/joinRequests').push({ id: myId, name: myName });
                enterGame();
                listenToChat();
            });
        }

        function enterGame() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('display-room-code').innerText = roomCode;

            // Cả Host và Client đều lắng nghe sự thay đổi của State
            db.ref('rooms/' + roomCode + '/state').on('value', (snap) => {
                if (snap.exists()) {
                    state = snap.val();
                    if (!state.players) state.players = [];
                    if (!state.lovers) state.lovers = [];
                    render();
                } else if (!isHost) {
                    alert("Chủ phòng đã thoát trò chơi!");
                    location.reload();
                }
            });
        }

        // ==========================================
        // 4. HỆ THỐNG ĐỒNG BỘ & CHAT
        // ==========================================
        function broadcast() {
            if (isHost) db.ref('rooms/' + roomCode + '/state').set(state);
        }

        function broadcastLog(text, type = '') {
            db.ref('rooms/' + roomCode + '/chat').push({ text, type });
        }

        function sendLogTo(playerId, text, type = '') {
            if (isHost) db.ref('rooms/' + roomCode + '/privateChat/' + playerId).push({ text, type });
        }

        function listenToChat() {
            // Lắng nghe kênh chat chung
            db.ref('rooms/' + roomCode + '/chat').on('child_added', (snap) => {
                const log = snap.val();
                addLog(log.text, log.type);
            });
            
            // Lắng nghe kênh chat riêng (ẩn danh cho Tiên tri, Cupid)
            db.ref('rooms/' + roomCode + '/privateChat/' + myId).on('child_added', (snap) => {
                const log = snap.val();
                addLog(log.text, log.type);
                snap.ref.remove(); // Đọc xong tự xóa để bảo mật
            });
        }

        function addLog(text, type = '') {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="log-item ${type ? 'log-' + type : ''}">${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if (input.value) {
                broadcastLog(`💬 <b>${myName}:</b> ${input.value}`);
                input.value = '';
            }
        }

        // ==========================================
        // 5. HỆ THỐNG LOGIC GAME LÕI
        // ==========================================
        function addAI() {
            while (state.players.length < state.maxPlayers) {
                state.players.push({ id: "AI_" + Math.random(), name: "Bot " + state.players.length, avatar: "🤖", isAI: true, alive: true, votes: 0 });
            }
            broadcast();
        }

        function startGame() {
            let roles = [];
            const wc = state.maxPlayers >= 10 ? 3 : 2;
            for(let i=0; i<wc; i++) roles.push({ id:'WOLF', name:'Ma Sói 🐺' });
            roles.push({ id:'SEER', name:'Tiên Tri 🔮' });
            roles.push({ id:'GUARD', name:'Bảo Vệ 🛡️' });
            
            // Nếu phòng 8 người trở lên, thêm Thợ săn & Thần tình yêu
            if (state.maxPlayers >= 8) {
                roles.push({ id:'HUNTER', name:'Thợ Săn 🏹' });
                roles.push({ id:'CUPID', name:'Thần Tình Yêu 💘' });
            }
            while(roles.length < state.maxPlayers) roles.push({ id:'VILLAGER', name:'Dân Làng 🧑‍🌾' });
            roles.sort(() => Math.random() - 0.5); // Xáo trộn

            state.players.forEach((p, i) => { p.role = roles[i]; p.alive = true; });
            state.lovers = []; 
            state.dayCount = 1;
            
            broadcastLog("🎲 VÁN CHƠI BẮT ĐẦU!", "system");
            state.players.forEach(p => {
                if(!p.isAI) sendLogTo(p.id, `🎭 Bạn là: <b>${p.role.name}</b>.`, 'system');
            });
            startNight();
        }

        function startNight() {
            state.phase = 'NIGHT'; selectedTargets = [];
            document.body.classList.add('day-mode');
            
            state.players.forEach(p => { 
                p.nightTargets = []; 
                p.actionDone = p.isAI || !['WOLF','SEER','GUARD','CUPID'].includes(p.role.id);
                // Cupid chỉ thức để bắn tên vào đêm 1, các đêm sau ngủ như dân
                if (p.role.id === 'CUPID' && state.dayCount > 1) p.actionDone = true; 
            });
            
            broadcastLog(`🌙 ĐÊM ${state.dayCount} buông xuống...`, 'system');
            broadcast(); 
            checkNightDone();
        }

        function submitAction(skip = false) {
            const me = state.players.find(p => p.id === myId);
            
            // Bắt lỗi Cupid chưa chọn đủ 2 người
            if (state.phase === 'NIGHT' && me.role.id === 'CUPID' && state.dayCount === 1 && selectedTargets.length !== 2) {
                return alert("Cupid phải chọn chính xác 2 người để ghép đôi!");
            }
            if (!skip && selectedTargets.length === 0) return alert("Bạn chưa chọn mục tiêu!");
            
            // Gửi dữ liệu hành động
            if (isHost) {
                processAction(myId, skip ? [] : selectedTargets);
            } else {
                db.ref('rooms/' + roomCode + '/actions').push({ playerId: myId, targets: skip ? [] : selectedTargets });
            }
        }

        function processAction(pId, targets) {
            const p = state.players.find(x => x.id === pId);
            if (!p || !p.alive || p.actionDone) return;
            
            p.nightTargets = targets; 
            p.actionDone = true;
            
            // Xử lý luôn Tiên Tri báo kết quả cho Client
            if (p.role.id === 'SEER' && targets.length > 0) {
                const target = state.players.find(x => x.id === targets[0]);
                sendLogTo(p.id, `🔮 ${target.name} là ${target.role.id==='WOLF'?'Sói':'Dân'}!`, 'seer');
            }
            broadcast(); 
            checkNightDone();
        }

        function checkNightDone() {
            if (isHost && !state.players.some(p => !p.actionDone)) {
                setTimeout(resolveNight, 1500);
            }
        }

        // Hàm xử lý chết chùm của Cupid
        function killPlayerCascade(playerId) {
            let p = state.players.find(x => x.id === playerId);
            if (!p || !p.alive) return [];
            
            p.alive = false;
            broadcastLog(`💀 <b>${p.name}</b> đã tử vong!`, 'death');
            let deads = [p];
            
            // Nếu người chết nằm trong cặp đôi tình nhân
            if (state.lovers && state.lovers.includes(p.id)) {
                let partnerId = state.lovers.find(x => x !== p.id);
                let partner = state.players.find(x => x.id === partnerId);
                if (partner && partner.alive) {
                    partner.alive = false;
                    broadcastLog(`💔 <b>${partner.name}</b> tự vẫn chết theo người yêu!`, 'death');
                    deads.push(partner);
                }
            }
            return deads; 
        }

        function resolveNight() {
            // 1. Chốt danh sách tình nhân của Cupid Đêm 1
            if (state.dayCount === 1) {
                const cupid = state.players.find(p => p.role.id === 'CUPID');
                if (cupid && !cupid.isAI && cupid.nightTargets && cupid.nightTargets.length === 2) {
                    state.lovers = cupid.nightTargets;
                    state.lovers.forEach(id => {
                        const partner = state.players.find(x => x.id === state.lovers.find(y => y !== id));
                        sendLogTo(id, `💘 <b>CUPID ĐÃ BẮN TÊN!</b> Bạn bị ghép đôi với <b>${partner.name}</b>. Sống cùng sống, chết cùng chết!`, 'cupid');
                    });
                }
            }

            // 2. Tính toán Sói và Bảo vệ
            const guard = state.players.find(p => p.role.id === 'GUARD' && p.alive);
            const guardTarget = (guard && guard.nightTargets) ? guard.nightTargets[0] : null;

            const wolves = state.players.filter(p => p.role.id === 'WOLF' && p.alive);
            let wolfTarget = (wolves.length && wolves[0].nightTargets) ? wolves[0].nightTargets[0] : null;

            broadcastLog(`☀️ TRỜI SÁNG NGÀY ${state.dayCount}!`, 'system');
            document.body.classList.remove('day-mode');
            
            let huntersToTrigger = [];
            
            // 3. Phán xét sinh tử
            if (wolfTarget && wolfTarget !== guardTarget) {
                let deads = killPlayerCascade(wolfTarget);
                deads.forEach(d => { if (d.role.id === 'HUNTER') huntersToTrigger.push(d); });
            } else {
                broadcastLog(`🛡️ Đêm qua bình yên, không ai chết.`, 'system');
            }

            // 4. Nếu Thợ Săn chết, cho Thợ Săn kéo theo 1 người
            if (huntersToTrigger.length > 0) {
                triggerHunter(huntersToTrigger[0]);
            } else {
                checkWinOrDiscuss();
            }
        }

        function triggerHunter(hunter) {
            state.phase = 'HUNTER'; 
            state.hunterId = hunter.id; 
            selectedTargets = [];
            broadcastLog(`🏹 Thợ săn <b>${hunter.name}</b> đang hấp hối, chuẩn bị kéo theo 1 người...`, 'death');
            
            if(hunter.isAI) { 
                setTimeout(checkWinOrDiscuss, 2000); 
            } else {
                broadcast();
            }
        }

        function resolveHunter() {
            if(selectedTargets.length > 0) {
                killPlayerCascade(selectedTargets[0]);
            }
            checkWinOrDiscuss();
        }

        function checkWinOrDiscuss() {
            const w = state.players.filter(p=>p.alive && p.role.id==='WOLF').length;
            const v = state.players.filter(p=>p.alive && p.role.id!=='WOLF').length;
            
            if (w === 0) { 
                state.phase='END'; broadcastLog("🎉 PHE DÂN LÀNG CHIẾN THẮNG!"); 
            } else if (w >= v) { 
                state.phase='END'; broadcastLog("🐺 PHE MA SÓI CHIẾN THẮNG!"); 
            } else { 
                state.phase='DAY'; selectedTargets=[]; 
            }
            broadcast();
        }

        // ==========================================
        // 6. HỆ THỐNG GIAO DIỆN (RENDER)
        // ==========================================
        function render() {
            const me = state.players.find(p => p.id === myId);
            if (!me) return;
            
            document.getElementById('phase-display').innerText = 
                state.phase === 'LOBBY' ? '⏳ SẢNH CHỜ' : 
                state.phase === 'NIGHT' ? '🌙 BAN ĐÊM' : 
                state.phase === 'DAY' ? '☀️ BAN NGÀY' : 
                state.phase === 'VOTE' ? '🗳️ BỎ PHIẾU' : '🏁 KẾT THÚC';
                
            document.getElementById('my-role-display').innerText = me.role ? `Vai: ${me.role.name}` : '';
            
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';
            
            state.players.forEach(p => {
                const card = document.createElement('div');
                const isLover = state.lovers.includes(myId) && state.lovers.includes(p.id);
                
                card.className = `player-card ${p.alive?'':'dead'} ${selectedTargets.includes(p.id)?'selected':''}`;
                card.innerHTML = `<div class="avatar">${p.alive?p.avatar:'🪦'}</div>
                                  <div class="p-name">${p.name} ${isLover?'💘':''}</div>
                                  <div class="p-status">${!p.alive ? p.role.name : (p.id===myId?'Bạn':'❓')}</div>`;
                
                if (p.alive && state.phase !== 'END') {
                    card.onclick = () => {
                        // Logic chọn mục tiêu
                        if(state.phase === 'NIGHT' && me.role && me.role.id === 'CUPID' && state.dayCount === 1) {
                            // Cupid chọn tối đa 2 người
                            if(selectedTargets.includes(p.id)) {
                                selectedTargets = selectedTargets.filter(x => x !== p.id);
                            } else if (selectedTargets.length < 2) {
                                selectedTargets.push(p.id);
                            }
                        } else {
                            // Các vai khác chỉ chọn 1
                            selectedTargets = selectedTargets[0] === p.id ? [] : [p.id];
                        }
                        render();
                    };
                }
                grid.appendChild(card);
            });

            const prompt = document.getElementById('action-prompt');
            const btns = document.getElementById('action-buttons');
            
            if(state.phase === 'LOBBY' && isHost) {
                prompt.innerText = "Chủ phòng điều khiển:";
                btns.innerHTML = `<button class="btn btn-success" onclick="startGame()">🚀 Bắt Đầu</button>
                                  <button class="btn btn-primary" onclick="addAI()">🤖 Thêm Bot (Cho đủ người)</button>`;
            } else if (state.phase === 'NIGHT' && me.alive && !me.actionDone) {
                if(me.role.id === 'CUPID') prompt.innerText = "💘 Cupid: Chọn 2 người để ghép đôi:";
                else prompt.innerText = "🌙 Chọn 1 mục tiêu đêm nay:";
                btns.innerHTML = `<button class="btn btn-warn" onclick="submitAction()">Xác nhận</button>`;
            } else if (state.phase === 'DAY' && isHost) {
                prompt.innerText = "Mọi người đang thảo luận ban ngày.";
                btns.innerHTML = `<button class="btn btn-warn" onclick="state.phase='VOTE'; broadcast();">Chuyển sang Bỏ Phiếu</button>`;
            } else if (state.phase === 'VOTE' && me.alive) {
                prompt.innerText = "🗳️ Chọn 1 người để treo cổ:";
                btns.innerHTML = `<button class="btn btn-warn" onclick="submitAction()">Treo cổ</button>
                                  <button class="btn" onclick="submitAction(true)">Bỏ qua</button>`;
            } else if (state.phase === 'HUNTER' && myId === state.hunterId) {
                prompt.innerText = "🏹 Bạn sắp chết, chọn 1 người bắn kéo theo:";
                btns.innerHTML = `<button class="btn btn-warn" onclick="resolveHunter()">Bắn!</button>`;
            } else {
                prompt.innerText = "Đang chờ người khác..."; 
                btns.innerHTML = "";
            }
        }
    </script>
</body>
</html>
